# Mantém data/verbetes.json (a lista de ruas com verbete que colore o mapa)
# em dia sempre que um verbete entra na main.
name: Índice de verbetes
on:
  push:
    branches: [main]
    paths: ["verbetes/**", "data/ruas.json", "scripts/indice.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  indice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validar.py
      - run: python scripts/indice.py
      - name: Gravar o índice se mudou
        run: |
          if git diff --quiet data/verbetes.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898231+github-actions[bot]@users.noreply.github.com"
          git add data/verbetes.json
          git commit -m "Atualiza o índice de verbetes"
          git push
